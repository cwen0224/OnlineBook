<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子繪本閱讀器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --coffee-glass: rgba(112, 74, 45, 0.5);
            --coffee-glass-hover: rgba(112, 74, 45, 0.72);
            --coffee-glass-border: rgba(255, 244, 226, 0.34);
            --coffee-glass-text: rgba(255, 250, 243, 0.92);
        }

        body {
            background: url('bg_optimized.webp') center/cover fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* ── Floating reader controls ── */
        #top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 0;
            z-index: 500;
            pointer-events: none;
        }
        #top-bar a {
            color: var(--coffee-glass-text);
            text-decoration: none;
            font-size: 0.82rem;
            display: flex; align-items: center; gap: 6px;
            position: absolute; top: 0; left: 0;
            padding: 9px 18px 10px 16px;
            border-radius: 0 0 18px 18px;
            border: 1px solid var(--coffee-glass-border); border-top: 0;
            background: var(--coffee-glass);
            backdrop-filter: blur(10px);
            transition: all 0.22s ease;
            pointer-events: auto;
        }
        #top-bar a:hover { background: var(--coffee-glass-hover); color: white; }
        #book-title {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            color: var(--coffee-glass-text); font-size: 0.78rem; letter-spacing: 0.02em;
            padding: 7px 14px 9px; border-radius: 0 0 18px 18px;
            border: 1px solid var(--coffee-glass-border); border-top: 0;
            background: var(--coffee-glass);
            backdrop-filter: blur(10px);
        }
        #page-indicator {
            color: var(--coffee-glass-text); font-size: 0.78rem; letter-spacing: 1px;
            min-width: 110px; text-align: center; padding: 9px 16px 10px 12px;
            border: 1px solid var(--coffee-glass-border); border-top: 0;
            border-radius: 0 0 18px 18px; background: var(--coffee-glass); backdrop-filter: blur(10px);
        }
        #reader-actions {
            position: absolute; top: 0; right: 0; display: flex; align-items: flex-start;
            gap: 8px; min-width: 110px; justify-content: flex-end; pointer-events: auto;
        }
        .top-action {
            display: none;
            color: var(--coffee-glass-text);
            background: var(--coffee-glass);
            border: 1px solid var(--coffee-glass-border); border-top: 0;
            border-radius: 0 0 18px 18px;
            padding: 9px 12px 10px 16px;
            font: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s ease, color 0.2s ease;
        }
        .top-action:hover { background: var(--coffee-glass-hover); color: white; }

        /* ── Scene ── */
        #scene {
            position: fixed;
            top: 40px; bottom: 0;
            left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 3000px;
            perspective-origin: 50% 50%;
            touch-action: none;
        }
        /* Keep the book out of the reading layer, with only its transparent edge touching. */
        @media (min-width: 641px) {
            body.translation-side #scene { right: calc(min(420px, 42vw) - 72px); }
        }
        body.translation-bottom #scene { bottom: calc(min(40vh, 340px) + 72px); }

        /*
         * #book = the full spread container (2 × page width)
         * transform-style so children 3D-flip in correct context
         */
        #book {
            position: relative;
            transform-style: preserve-3d;
            /* slight tilt for depth feel */
            transform: rotateX(4deg);
            touch-action: none;
        }

        /*
         * Each .leaf sits on the RIGHT half of the book.
         * transform-origin: left center  →  spins around the spine.
         */
        .leaf {
            position: absolute;
            top: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            cursor: grab;
            will-change: transform;
        }
        .leaf:active { cursor: grabbing; }

        .face {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
            background: #fff;
        }
        .face.front { transform: rotateY(0deg); }
        .face.back  { transform: rotateY(180deg); }

        .face img {
            width: 100%; height: 100%;
            object-fit: contain;   /* ← show full page, no crop */
            object-position: center;
            display: block;
            pointer-events: none;
            background: #fff;
        }

        .page-english-box {
            position: absolute;
            z-index: 3;
            box-sizing: border-box;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: clamp(6px, min(1vw, 1.2vh), 12px);
            border: 1px solid rgba(255, 244, 226, 0.24);
            border-radius: 10px;
            background: rgba(112, 74, 45, 0.5);
            color: #fffaf3;
            font-size: clamp(12px, 1.12vw, 20px);
            line-height: 1.48;
            white-space: pre-line;
            overflow-wrap: anywhere;
            text-shadow: 0 1px 2px rgba(0,0,0,.35);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,250,243,.35) transparent;
            pointer-events: auto;
        }
        body.page-english-open .page-english-box { display: flex; }
        body.legacy-translation-view .page-english-box { display: none !important; }
        .page-english-box::-webkit-scrollbar { width: 5px; }
        .page-english-box::-webkit-scrollbar-thumb { background: rgba(255,250,243,.3); border-radius: 8px; }
        body.strip-preview {
            --strip-preview-height: 0px;
            --strip-preview-bottom: 56px;
            --strip-preview-gap: 12px;
        }
        body.strip-preview #scene {
            top: var(--strip-preview-scene-top, 40px);
            bottom: var(--strip-preview-scene-bottom, calc(var(--strip-preview-height) + var(--strip-preview-bottom) + var(--strip-preview-gap)));
        }
        .page-english-strips {
            position: fixed;
            z-index: 450;
            left: 50%;
            bottom: var(--strip-preview-bottom, 56px);
            transform: translateX(-50%);
            width: min(90vw, 1224px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            pointer-events: none;
            transform-origin: top center;
        }
        .page-english-strip {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            min-width: 0;
            box-sizing: border-box;
            max-height: min(32vh, 280px);
            padding: 10px 16px;
            border: 1px solid rgba(255, 244, 226, 0.24);
            border-radius: 14px;
            background: var(--coffee-glass);
            color: #fffaf3;
            font-size: clamp(16px, 1.25vw, 20px);
            line-height: 1.42;
            text-align: left !important;
            justify-self: stretch;
            overflow-y: auto;
            overflow-wrap: anywhere;
            text-shadow: 0 1px 2px rgba(0,0,0,.35);
            white-space: normal;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,250,243,.32) transparent;
        }
        .page-english-strip-text {
            display: block;
            width: 100%;
            min-width: 0;
            text-align: left !important;
            text-align-last: left !important;
            white-space: normal;
        }
        .page-english-strip-text p {
            margin: 0;
            line-height: inherit;
            white-space: pre-line;
        }
        .page-english-strip-text .empty-paragraph {
            height: .71em;
            margin: 0;
            padding: 0;
            line-height: 0;
        }
        .page-english-strip.is-scrollable { padding-bottom: 34px; }
        .page-english-strip.is-scrollable::before {
            content: '';
            position: absolute;
            z-index: 1;
            left: 0;
            right: 0;
            bottom: 0;
            height: 42px;
            background: linear-gradient(to bottom, rgba(112,74,45,0), rgba(112,74,45,.86));
            pointer-events: none;
        }
        .page-english-strip.is-scrollable::after {
            content: '↓ Scroll';
            position: absolute;
            z-index: 2;
            right: 8px;
            bottom: 5px;
            padding: 2px 8px;
            border: 1px solid rgba(255,244,226,.2);
            border-radius: 999px;
            background: rgba(76,49,31,.74);
            color: rgba(255,250,243,.88);
            font-size: 11px;
            line-height: 1.35;
            letter-spacing: .02em;
            text-shadow: 0 1px 2px rgba(0,0,0,.4);
            pointer-events: none;
        }
        .page-english-strip::-webkit-scrollbar { width: 5px; }
        .page-english-strip::-webkit-scrollbar-thumb { background: rgba(255,250,243,.28); border-radius: 8px; }
        body:not(.strip-preview) .page-english-strips { display: none; }
        body.strip-preview:not(.page-english-open) .page-english-strips { display: none; }
        body.strip-page-open #hint { display: none; }
        body.strip-page-open .page-english-box { display: none !important; }
        body.strip-preview:not(.legacy-translation-view) .page-english-box { display: none !important; }
        body.strip-preview.strip-page-open .page-english-strips { top: var(--strip-preview-strip-top, auto); bottom: auto; }
        @media (max-width: 640px) {
            .page-english-box { padding: 8px; font-size: clamp(11px, 3.2vw, 16px); }
            body.strip-preview {
                --strip-preview-bottom: 54px;
                --strip-preview-gap: 12px;
            }
            body.strip-preview #controls { bottom: 20px; }
            body.strip-preview.strip-page-open .page-english-strips {
                transform: translateX(-50%) scale(var(--strip-preview-scale, 1));
            }
            .page-english-strips { width: 96vw; gap: 6px; }
            .page-english-strip { max-height: min(36vh, 300px); padding: 9px 10px; font-size: clamp(14px, 4vw, 16px); line-height: 1.38; }
            .page-english-strip-text .empty-paragraph { height: .69em; }
            .page-english-strip.is-scrollable { padding-bottom: 34px; }
            .page-english-strip.is-scrollable::after { right: 6px; bottom: 4px; }
        }

        /* Subtle spine-edge shadow only — no overlay gradients */
        .face.front::after,
        .face.back::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 18px;
            pointer-events: none;
            opacity: 0;   /* hidden; only shown during flip via JS */
            transition: opacity 0.3s;
        }
        .face.front::after { left: 0;  background: linear-gradient(to right, rgba(0,0,0,0.18), transparent); }
        .face.back::after  { right: 0; background: linear-gradient(to left,  rgba(0,0,0,0.18), transparent); }

        /* Page number badge */
        .page-num {
            position: absolute;
            bottom: 10px;
            font-size: 0.7rem;
            color: rgba(0,0,0,0.35);
            font-family: monospace;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.06);
            pointer-events: none;
        }
        .face.front .page-num { right: 10px; }
        .face.back  .page-num { left:  10px; }

        /* Left-side static background (already-flipped pages rest here) */
        /* No static left-bg needed anymore to avoid "page zero" glitch */

        /* ── Bottom Controls ── */
        #controls {
            position: fixed;
            bottom: 0; left: 50%; transform: translateX(-50%);
            height: auto;
            display: flex; align-items: center; justify-content: center; gap: 20px;
            z-index: 500;
        }
        .ctrl-btn {
            background: var(--coffee-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--coffee-glass-border);
            color: var(--coffee-glass-text);
            padding: 10px 26px 9px;
            border-radius: 18px 18px 0 0;
            border-bottom: 0;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.22s ease, border-color 0.22s ease, color 0.22s ease;
            letter-spacing: 1px;
        }
        .ctrl-btn:hover:not(:disabled) {
            background: var(--coffee-glass-hover);
            border-color: rgba(255,244,226,0.48);
            transform: none;
        }
        .ctrl-btn:disabled { opacity: 0.22; cursor: not-allowed; }
        #spread-info {
            color: var(--coffee-glass-text); font-size: 0.78rem; min-width: 90px;
            text-align: center; padding: 10px 14px 9px;
            border: 1px solid var(--coffee-glass-border); border-bottom: 0;
            border-radius: 18px 18px 0 0; background: var(--coffee-glass); backdrop-filter: blur(10px);
        }

        /* ── Loading ── */
        #loading-screen {
            position: fixed; inset: 0;
            background: url('natural-wooden-background.jpg') center/cover;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: rgba(120,160,255,0.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { margin-top: 16px; color: rgba(255,255,255,0.7); font-size: 0.85rem; letter-spacing: 2px; }
        #loading-progress { margin-top: 8px; color: rgba(120,160,255,0.8); font-size: 0.75rem; font-family: monospace; }

        /* Hint */
        #hint {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.28); font-size: 0.72rem; letter-spacing: 1px;
            pointer-events: none; white-space: nowrap;
            animation: fadeHint 5s ease forwards;
        }
        @keyframes fadeHint { 0%,60%{opacity:1} 100%{opacity:0} }

        /* English reading aid: a gradient reading layer over the artwork. */
        #translation-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: min(420px, 42vw);
            display: none;
            flex-direction: column;
            background: linear-gradient(to left, rgba(8,8,16,0.60) 0%, rgba(8,8,16,0.52) 70%, rgba(8,8,16,0) 100%);
            color: rgba(255,255,255,0.9);
            z-index: 400;
            overflow: hidden;
        }
        #translation-panel.is-open { display: flex; }
        #translation-close {
            appearance: none; border: 0; background: transparent; color: rgba(255,255,255,0.65);
            position: absolute; top: 10px; right: 12px; z-index: 1;
            font-size: 1.35rem; line-height: 1; cursor: pointer; padding: 2px 4px;
        }
        #translation-close:hover { color: white; }
        #translation-content {
            overflow-y: auto;
            padding: 17px 42px 17px 17px;
            font-size: 1.08rem;
            line-height: 1.72;
            white-space: pre-line;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.32) transparent;
        }
        #translation-content::-webkit-scrollbar { width: 8px; }
        #translation-content::-webkit-scrollbar-track { background: transparent; }
        #translation-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.28);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 999px;
        }
        #translation-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.45); }
        #translation-content::-webkit-scrollbar-button { display: none; }
        body.translation-side #translation-panel {
            border: 0;
            border-radius: 0;
            box-shadow: none;
            background: linear-gradient(to left, rgba(8,8,16,0.60) 0%, rgba(8,8,16,0.52) 68%, rgba(8,8,16,0) 100%);
        }
        body.translation-side #translation-content {
            padding: 52px 42px 42px clamp(140px, 10vw, 220px);
        }
        body.translation-bottom #translation-panel {
            top: auto;
            right: 0;
            bottom: 0;
            left: 0;
            width: auto;
            height: calc(min(40vh, 340px) + 72px);
            background: linear-gradient(to top, rgba(8,8,16,0.60) 0%, rgba(8,8,16,0.52) 70%, rgba(8,8,16,0) 100%);
        }
        body.translation-bottom #translation-content {
            width: min(1080px, 88vw);
            align-self: center;
            padding: 28px 30px 92px;
        }
        #translation-content p + p { margin-top: 1.35rem; }
        #translation-content .empty { color: rgba(255,255,255,0.55); }
        @media (max-width: 640px) {
            #top-bar { top: 0; left: 0; right: 0; }
            #top-bar a { padding: 7px 10px; }
            #book-title { display: none; }
            #controls { bottom: 0; width: 100vw; gap: 5px; min-height: 46px; }
            .ctrl-btn {
                flex: 0 0 auto;
                white-space: nowrap;
                letter-spacing: 0;
                font-size: 0.74rem;
                padding: 8px 10px;
            }
            #spread-info {
                flex: 0 0 auto;
                min-width: 0;
                white-space: nowrap;
                font-size: 0.68rem;
                padding: 8px 6px;
            }
            #translation-panel { width: min(88vw, 420px); }
            body.translation-bottom #translation-panel { bottom: 0; width: auto; height: calc(min(42vh, 300px) + 64px); }
            body.translation-bottom #translation-content { width: 92vw; padding: 22px 20px 78px; }
            body.translation-side #translation-content { padding: 46px 32px 28px 72px; }
            body.translation-side #scene { right: calc(min(88vw, 420px) - 50px); }
            body.translation-bottom #scene { bottom: calc(min(42vh, 300px) + 64px); }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">正在準備繪本內容...</div>
    <div id="loading-progress">0%</div>
</div>

<div id="top-bar">
    <a href="index.html">&#8592; 返回書架</a>
    <span id="book-title">電子繪本</span>
    <div id="reader-actions">
        <button class="top-action" id="translation-toggle" type="button" aria-expanded="false">English text</button>
        <span id="page-indicator">—</span>
    </div>
</div>

<div id="scene">
    <div id="book">
        <!-- Leaves are stacked here -->
    </div>
</div>

<div id="hint">點擊或拖曳書頁翻頁・← → 鍵盤也可以</div>

<aside id="translation-panel" aria-label="English translation" aria-live="polite">
    <button id="translation-close" type="button" aria-label="Close English translation">×</button>
    <div id="translation-content"></div>
</aside>

<div id="controls">
    <button class="ctrl-btn" id="btn-prev">&#8592; 上一頁</button>
    <span id="spread-info">— / —</span>
    <button class="ctrl-btn" id="btn-next">下一頁 &#8594;</button>
</div>

<script src="translations.js?v=20261115-reader-refresh"></script>
<script>
(async () => {
    // ── Params & Localization ──
    const params  = new URLSearchParams(location.search);
    const bookKey = params.get('book') || 'zaojiao';
    const legacyPanelEnabled = params.get('legacy') === '1';
    document.body.classList.toggle('legacy-translation-view', legacyPanelEnabled);
    const LANGUAGE_PREFERENCE_KEY = 'onlinebook.language';
    let savedLanguage = null;
    try { savedLanguage = localStorage.getItem(LANGUAGE_PREFERENCE_KEY); } catch (_) { /* Keep the default below. */ }
    // A language in the link is an intentional choice; otherwise restore the last choice.
    const lang = params.get('lang') || savedLanguage || 'zh-TW';
    try { localStorage.setItem(LANGUAGE_PREFERENCE_KEY, lang); } catch (_) { /* Storage may be unavailable in private mode. */ }
    let hasPageEnglishStrips = false;
    document.body.classList.toggle('strip-preview', hasPageEnglishStrips);

    const i18n = {
        'zh-TW': {
            titles: { zaojiao: '社會系列・藻礁保衛戰', shigo: '親子系列・海客石滬', zaojiao_story: '桃園戶海系列・藻礁繪本', penghu_shihu: '桃園戶海系列・石滬爺爺說故事', nautilus: '桃園戶海系列・活化石的心聲—鸚鵡螺', chequbei: '桃園戶海系列・守護海中玫瑰—硨磲貝' },
            loading: '正在準備繪本內容...',
            prev: '← 上一頁',
            next: '下一頁 →',
            back: '← 返回書架',
            hint: '點擊或拖曳書頁翻頁・← → 鍵盤也可以',
            showEnglish: '顯示英文',
            hideEnglish: '收合英文',
            englishPanelLabel: '英文翻譯',
            closeEnglish: '關閉英文翻譯'
        },
        'en': {
            titles: { zaojiao: 'Social Series: Algal Reef Defense', shigo: 'Parenting Series: Shigo Stone Weir', zaojiao_story: 'Taoyuan Coastal Series: Algal Reef Picture Book', penghu_shihu: 'Taoyuan Coastal Series: Grandpa Stone Weir Tells a Story', nautilus: 'Taoyuan Coastal Series: Voice of a Living Fossil: The Nautilus', chequbei: 'Taoyuan Coastal Series: Guardians of the Sea Rose: Giant Clam' },
            loading: 'Preparing book content...',
            prev: '← Prev',
            next: 'Next →',
            back: '← Library',
            hint: 'Click or drag to flip • Arrow keys supported',
            showEnglish: 'Show English',
            hideEnglish: 'Collapse English',
            englishPanelLabel: 'English translation',
            closeEnglish: 'Close English translation'
        }
    };

    const t = i18n[lang] || i18n['zh-TW'];
    document.getElementById('book-title').textContent = t.titles[bookKey] || 'E-Book';
    document.title = (t.titles[bookKey] || 'E-Book') + ' | Reader';
    document.getElementById('loading-text').textContent = t.loading;
    document.getElementById('btn-prev').textContent = t.prev;
    document.getElementById('btn-next').textContent = t.next;
    document.querySelector('#top-bar a').textContent = t.back;
    document.getElementById('hint').textContent = t.hint;
    document.getElementById('translation-panel').setAttribute('aria-label', t.englishPanelLabel);
    document.getElementById('translation-close').setAttribute('aria-label', t.closeEnglish);

    // ── English translation panel ──
    let translationEntries = [...((window.bookTranslations && window.bookTranslations[bookKey]) || [])];
    let placementPages = [];
    // Both supplied translations start after four cover / front-matter scans.
    const translationPageOffset = bookKey === 'zaojiao' ? 4 : bookKey === 'penghu_shihu' ? 3 : 0;
    try {
        const response = await fetch('text-placement-zones.json?v=20261115-coffee-overlays');
        if (response.ok) {
            const placementData = await response.json();
            placementPages = placementData.books?.[bookKey]?.pages || [];
            hasPageEnglishStrips = placementPages.some((page) => typeof page.bottomStripText === 'string' && page.bottomStripText.trim());
            document.body.classList.toggle('strip-preview', hasPageEnglishStrips && !legacyPanelEnabled);
            const placementEntries = placementPages
                .filter((page) => page.englishTranslation && page.translationScope?.granularity === 'reader-pages')
                .map((page) => ({
                    readerStart: page.translationScope.startPage ?? page.page,
                    readerEnd: page.translationScope.endPage ?? page.page,
                    text: page.englishTranslation
                }));
            const isCoveredByExistingText = (candidate) => translationEntries.some((entry) => {
                const start = entry.readerStart ?? entry.start + translationPageOffset;
                const end = entry.readerEnd ?? entry.end + translationPageOffset;
                return start <= candidate.readerEnd && end >= candidate.readerStart;
            });
            translationEntries.push(...placementEntries.filter((entry) => !isCoveredByExistingText(entry)));
        }
    } catch (error) {
        console.warn(`Could not load supplemental page translations for ${bookKey}.`, error);
    }
    const translationToggle = document.getElementById('translation-toggle');
    const translationPanel = document.getElementById('translation-panel');
    const translationContent = document.getElementById('translation-content');
    let translationPlacement = 'side';
    let englishOpen = lang === 'en';

    function resolveTranslationPlacement(firstPage, visiblePages = []) {
        const ratio = firstPage?.height && firstPage?.width
            ? firstPage.height / firstPage.width
            : 1.414;
        const activeText = translationEntries
            .filter((entry) => {
                const start = entry.readerStart ?? entry.start + translationPageOffset;
                const end = entry.readerEnd ?? entry.end + translationPageOffset;
                return visiblePages.some((page) => start <= page && end >= page);
            })
            .map((entry) => entry.text)
            .join(' ');
        const isLongAppendix = bookKey === 'penghu_shihu'
            && visiblePages.some((page) => page >= 37 && page <= 48)
            && activeText.length > 500;
        return ratio < 1 || isLongAppendix ? 'bottom' : 'side';
    }

    function updateTranslationToggleLabel(isOpen) {
        translationToggle.textContent = isOpen ? t.hideEnglish : t.showEnglish;
    }

    function pageTranslation(pageNumber) {
        return placementPages.find((page) => {
            return page.page === pageNumber && page.zones?.length && page.englishTranslation;
        });
    }

    function appendPageEnglishBox(face, pageNumber) {
        const page = pageTranslation(pageNumber);
        if (!page) return;
        for (const zone of page.zones) {
            const points = zone.polygon;
            if (!Array.isArray(points) || points.length < 4) continue;
            const xs = points.map(([x]) => x);
            const ys = points.map(([, y]) => y);
            const left = Math.min(...xs), top = Math.min(...ys);
            const width = Math.max(...xs) - left, height = Math.max(...ys) - top;
            if (width <= 0 || height <= 0) continue;
            const box = document.createElement('div');
            box.className = 'page-english-box';
            box.dataset.page = String(pageNumber);
            const zoneText = zone.englishText || (page.zones.length === 1 ? page.englishTranslation : '');
            if (!zoneText) continue;
            box.textContent = zoneText;
            box.setAttribute('lang', 'en');
            box.setAttribute('aria-label', `English translation for page ${pageNumber}`);
            box.style.left = `${left}%`;
            box.style.top = `${top}%`;
            box.style.width = `${width}%`;
            box.style.height = `${height}%`;
            box.style.clipPath = `polygon(${points.map(([x, y]) => `${((x - left) / width) * 100}% ${((y - top) / height) * 100}%`).join(', ')})`;
            face.append(box);
        }
    }

    function renderPageEnglishStrips() {
        if (!hasPageEnglishStrips) return;
        const strips = document.createElement('div');
        strips.id = 'page-english-strips';
        strips.className = 'page-english-strips';
        document.body.append(strips);
        updatePageEnglishStrips();
    }

    let stripCueObserver = null;
    let stripLayoutRebuildQueued = false;
    function updatePageEnglishStrips() {
        if (!hasPageEnglishStrips || legacyPanelEnabled) return;
        const strips = document.getElementById('page-english-strips');
        if (!strips) return;
        stripCueObserver?.disconnect();
        stripCueObserver = null;
        strips.replaceChildren();
        if (!englishOpen) {
            document.body.classList.remove('strip-page-open');
            const previousHeight = Number.parseFloat(getComputedStyle(document.body).getPropertyValue('--strip-preview-height')) || 0;
            document.body.style.setProperty('--strip-preview-height', '0px');
            document.body.style.removeProperty('--strip-preview-scene-top');
            document.body.style.removeProperty('--strip-preview-scene-bottom');
            document.body.style.removeProperty('--strip-preview-strip-top');
            document.body.style.removeProperty('--strip-preview-page-height');
            document.body.style.setProperty('--strip-preview-scale', '1');
            if (previousHeight > 1) requestAnimationFrame(rebuildBookForAvailableSpace);
            return;
        }
        const [firstPage, lastPage] = visiblePrintedPages();
        const hasVisibleStrip = [firstPage, lastPage].some((pageNumber) => {
            const page = placementPages.find((item) => item.page === pageNumber);
            return typeof page?.bottomStripText === 'string' && page.bottomStripText.trim();
        });
        document.body.classList.toggle('strip-page-open', hasVisibleStrip);
        if (!hasVisibleStrip || !englishOpen) {
            const previousHeight = Number.parseFloat(getComputedStyle(document.body).getPropertyValue('--strip-preview-height')) || 0;
            document.body.style.setProperty('--strip-preview-height', '0px');
            document.body.style.removeProperty('--strip-preview-scene-top');
            document.body.style.removeProperty('--strip-preview-scene-bottom');
            document.body.style.removeProperty('--strip-preview-strip-top');
            document.body.style.removeProperty('--strip-preview-page-height');
            document.body.style.setProperty('--strip-preview-scale', '1');
            if (previousHeight > 1) requestAnimationFrame(rebuildBookForAvailableSpace);
            return;
        }
        for (const pageNumber of new Set([firstPage, lastPage])) {
            if (pageNumber < 1) continue;
            const page = placementPages.find((item) => item.page === pageNumber);
            const pageText = typeof page?.bottomStripText === 'string' ? page.bottomStripText.trim() : '';
            if (!pageText) continue;
            const strip = document.createElement('div');
            strip.className = 'page-english-strip';
            strip.dataset.page = String(pageNumber);
            strip.dataset.englishText = pageText;
            strip.style.gridColumn = pageNumber % 2 === 0 ? '1' : '2';
            const stripText = document.createElement('div');
            stripText.className = 'page-english-strip-text';
            const paragraphs = pageText.split(/\n\s*\n/);
            paragraphs.forEach((paragraph, index) => {
                const paragraphElement = document.createElement('p');
                paragraphElement.textContent = paragraph;
                stripText.append(paragraphElement);
                if (index < paragraphs.length - 1) {
                    const blankParagraph = document.createElement('p');
                    blankParagraph.className = 'empty-paragraph';
                    blankParagraph.setAttribute('aria-hidden', 'true');
                    stripText.append(blankParagraph);
                }
            });
            strip.append(stripText);
            strip.setAttribute('lang', 'en');
            strip.setAttribute('aria-label', `English translation for page ${pageNumber}`);
            strips.append(strip);
        }
        const syncStripScrollCues = () => strips.querySelectorAll('.page-english-strip').forEach((strip) => {
            strip.classList.toggle('is-scrollable', strip.scrollHeight > strip.clientHeight + 1);
        });
        if ('ResizeObserver' in window) {
            stripCueObserver = new ResizeObserver(() => requestAnimationFrame(syncStripScrollCues));
            strips.querySelectorAll('.page-english-strip').forEach((strip) => stripCueObserver.observe(strip));
        }
        setTimeout(syncStripScrollCues, 140);
        {
            const previousHeight = Number.parseFloat(getComputedStyle(document.body).getPropertyValue('--strip-preview-height')) || 0;
            strips.querySelectorAll('.page-english-strip').forEach((strip) => {
                strip.classList.toggle('is-scrollable', strip.scrollHeight > strip.clientHeight + 1);
            });
            let measuredHeight;
            let mobileLayoutChanged = false;
            if (window.matchMedia('(max-width: 640px)').matches) {
                mobileLayoutChanged = positionMobileStripComposition(strips);
                measuredHeight = Math.ceil(strips.getBoundingClientRect().height);
            } else {
                mobileLayoutChanged = positionDesktopStripComposition(strips);
                measuredHeight = Math.ceil(strips.getBoundingClientRect().height);
            }
            document.body.style.setProperty('--strip-preview-height', `${measuredHeight}px`);
            if ((mobileLayoutChanged || Math.abs(measuredHeight - previousHeight) > 1) && !stripLayoutRebuildQueued) {
                stripLayoutRebuildQueued = true;
                requestAnimationFrame(() => {
                    rebuildBookForAvailableSpace();
                    stripLayoutRebuildQueued = false;
                });
            }
            requestAnimationFrame(syncStripScrollCues);
        }
    }

    function positionDesktopStripComposition(strips) {
        const bodyStyle = document.body.style;
        const scene = document.getElementById('scene');
        const controlsRect = document.getElementById('controls').getBoundingClientRect();
        const safeTop = 48;
        const safeBottom = controlsRect.top - 16;
        const safeHeight = Math.max(0, safeBottom - safeTop);
        const gap = 27;
        const renderedBookHeight = document.getElementById('book').getBoundingClientRect().height;
        const naturalPageHeight = renderedBookHeight > 1
            ? renderedBookHeight
            : scene.clientWidth * 0.96 * PAGE_RATIO / 2;
        const naturalStripHeight = strips.offsetHeight;
        const pageHeight = Math.min(naturalPageHeight, Math.max(1, safeHeight - gap - naturalStripHeight));
        const groupHeight = pageHeight + gap + naturalStripHeight;
        const pageTop = safeTop + Math.max(0, (safeHeight - groupHeight) / 2);
        const pageBottom = pageTop + pageHeight;
        const sceneHeight = pageHeight / 0.94;
        const letterbox = (sceneHeight - pageHeight) / 2;
        const next = {
            '--strip-preview-scene-top': `${pageTop - letterbox}px`,
            '--strip-preview-scene-bottom': `${window.innerHeight - pageBottom - letterbox}px`,
            '--strip-preview-strip-top': `${pageBottom + gap}px`,
            '--strip-preview-page-height': `${pageHeight}px`,
            '--strip-preview-scale': '1',
        };
        let changed = false;
        for (const [property, value] of Object.entries(next)) {
            if (bodyStyle.getPropertyValue(property).trim() !== value) changed = true;
            bodyStyle.setProperty(property, value);
        }
        return changed || Math.abs(pageHeight - naturalPageHeight) > 1;
    }

    function positionMobileStripComposition(strips) {
        const bodyStyle = document.body.style;
        const scene = document.getElementById('scene');
        const controls = document.getElementById('controls');
        const controlsRect = controls.getBoundingClientRect();
        const safeTop = 48;
        const controlsGap = 12;
        const safeBottom = controlsRect.top - controlsGap;
        const safeHeight = Math.max(0, safeBottom - safeTop);
        const gap = 12;
        const naturalStripHeight = strips.offsetHeight;
        const naturalPageHeight = scene.clientWidth * 0.96 * PAGE_RATIO / 2;
        const compositionHeight = naturalPageHeight + gap + naturalStripHeight;
        const scale = Math.min(1, Math.max(0.05, (safeHeight - gap) / Math.max(1, compositionHeight)));
        const pageHeight = naturalPageHeight * scale;
        const renderedStripHeight = naturalStripHeight * scale;
        const groupHeight = pageHeight + gap + renderedStripHeight;
        const slack = Math.max(0, (safeHeight - groupHeight) / 2);
        const pageTop = safeTop + slack;
        const pageBottom = pageTop + pageHeight;
        const stripTop = pageBottom + gap;
        const sceneHeight = pageHeight / 0.94;
        const sceneLetterbox = (sceneHeight - pageHeight) / 2;
        const next = {
            '--strip-preview-scene-top': `${pageTop - sceneLetterbox}px`,
            '--strip-preview-scene-bottom': `${window.innerHeight - pageBottom - sceneLetterbox}px`,
            '--strip-preview-strip-top': `${stripTop}px`,
            '--strip-preview-page-height': `${pageHeight}px`,
            '--strip-preview-scale': String(scale),
        };
        let changed = false;
        for (const [property, value] of Object.entries(next)) {
            const current = bodyStyle.getPropertyValue(property).trim();
            if (current !== value) changed = true;
            bodyStyle.setProperty(property, value);
        }
        return changed;
    }

    function fitPageEnglishBoxes() {
        const minimumFontSize = window.matchMedia('(max-width: 640px)').matches ? 11 : 12;
        book.querySelectorAll('.page-english-box').forEach((box) => {
            box.style.display = 'flex';
            const preferredSize = parseFloat(getComputedStyle(box).fontSize);
            let size = preferredSize;
            while (size > minimumFontSize
                && (box.scrollWidth > box.clientWidth + 1 || box.scrollHeight > box.clientHeight + 1)) {
                size = Math.max(minimumFontSize, size - 0.5);
                box.style.fontSize = `${size}px`;
            }
            box.style.display = '';
        });
    }

    function visiblePrintedPages() {
        const flipped = leaves.filter(l => l.angle === -180).length;
        if (flipped === 0) return [1, Math.min(2, TOTAL_PAGES)];
        return [Math.min(flipped * 2, TOTAL_PAGES), Math.min(flipped * 2 + 1, TOTAL_PAGES)];
    }

    function updateTranslation() {
        const [first, last] = visiblePrintedPages();
        const activeEntries = translationEntries.filter((entry) => {
            const entryStart = entry.readerStart ?? entry.start + translationPageOffset;
            const entryEnd = entry.readerEnd ?? entry.end + translationPageOffset;
            return entryStart <= last && entryEnd >= first;
        });
        const shouldShowFallbackPanel = legacyPanelEnabled && englishOpen && activeEntries.length > 0;
        const panelWasOpen = translationPanel.classList.contains('is-open');
        translationPanel.classList.toggle('is-open', shouldShowFallbackPanel);
        document.body.classList.toggle('translation-open', shouldShowFallbackPanel);

        const nextPlacement = resolveTranslationPlacement(firstPage, [first, last]);
        if (shouldShowFallbackPanel && nextPlacement !== translationPlacement) {
            translationPlacement = nextPlacement;
            document.body.classList.toggle('translation-side', translationPlacement === 'side');
            document.body.classList.toggle('translation-bottom', translationPlacement === 'bottom');
            requestAnimationFrame(rebuildBookForAvailableSpace);
        }
        if (!shouldShowFallbackPanel) {
            document.body.classList.remove('translation-side', 'translation-bottom');
        }
        translationContent.replaceChildren();

        if (!shouldShowFallbackPanel || !activeEntries.length) {
            if (panelWasOpen) requestAnimationFrame(rebuildBookForAvailableSpace);
            return;
        }

        activeEntries.forEach((entry) => {
            const text = document.createElement('p');
            text.textContent = entry.text;
            translationContent.append(text);
        });
    }

    function setTranslationOpen(isOpen) {
        englishOpen = isOpen;
        document.body.classList.toggle('page-english-open', isOpen);
        translationToggle.setAttribute('aria-expanded', String(isOpen));
        updateTranslationToggleLabel(isOpen);
        updateTranslation();
        updatePageEnglishStrips();
    }

    if (translationEntries.length || hasPageEnglishStrips) {
        translationToggle.style.display = 'inline-block';
        translationToggle.addEventListener('click', () => {
            setTranslationOpen(!englishOpen);
        });
        document.getElementById('translation-close').addEventListener('click', () => {
            setTranslationOpen(false);
        });
        const openByDefault = lang === 'en';
        englishOpen = openByDefault;
        document.body.classList.toggle('page-english-open', openByDefault);
        translationToggle.setAttribute('aria-expanded', String(openByDefault));
        updateTranslationToggleLabel(openByDefault);
    }

    // ── Load JSON ──
    let pagesData = [];
    try {
        const res = await fetch(`book_${bookKey}_${lang}.json?v=${Date.now()}`);
        if (!res.ok) throw new Error(res.status);
        pagesData = await res.json();
    } catch(e) {
        document.getElementById('loading-text').textContent = (lang === 'en') ? 'Failed to load book data' : '無法載入繪本資料';
        console.error(e);
        return;
    }

    // ── Compute page aspect ratio from JSON data ──
    const firstPage = pagesData[0];
    const PAGE_RATIO = (firstPage && firstPage.width && firstPage.height)
        ? (firstPage.height / firstPage.width) 
        : 1.414;

    console.log("Detecting Book Ratio:", PAGE_RATIO, "isLandscape:", PAGE_RATIO < 1);

    // Portrait pages read best with a side column; a landscape spread keeps its width and uses a lower panel.
    // At this point page leaves have not been built yet; use the initial spread directly.
    translationPlacement = resolveTranslationPlacement(firstPage, [1, Math.min(2, pagesData.length)]);

    const TOTAL_PAGES  = pagesData.length;
    // Bump this whenever page image assets are regenerated so visitors do not see stale scans.
    const IMAGE_VERSION = '20261119-chequbei-v1';
    const imageUrl = (page) => `${page.image}?v=${IMAGE_VERSION}`;
    const TOTAL_LEAVES = Math.ceil(TOTAL_PAGES / 2);
    // This book has no back cover after its final spread, so do not expose a blank page.
    const MAX_FLIPPED_LEAVES = bookKey === 'zaojiao_story' ? TOTAL_LEAVES - 1 : TOTAL_LEAVES;

    // ── Compute book size ──
    // Each page is portrait. Two pages side-by-side = landscape spread.
    // We fit the spread into the available viewport area.
    function getSize() {
        const sceneRect = document.getElementById('scene').getBoundingClientRect();
        const availW = sceneRect.width;
        const availH = sceneRect.height;

        if (hasPageEnglishStrips && document.body.classList.contains('strip-page-open')) {
            const previewPageHeight = Number.parseFloat(document.body.style.getPropertyValue('--strip-preview-page-height'));
            if (previewPageHeight > 0) {
                const leafH = Math.floor(previewPageHeight);
                const leafW = Math.floor(leafH / PAGE_RATIO);
                return { leafW, leafH, spreadW: leafW * 2, spreadH: leafH };
            }
        }

        // Spread is 2 pages wide
        // Spread W / Spread H = 2 / PAGE_RATIO
        const spreadRatio = 2 / PAGE_RATIO;

        let spreadW, spreadH;
        if (availW / availH > spreadRatio) {
            // Height-constrained
            spreadH = availH * 0.94;
            spreadW = spreadH * spreadRatio;
        } else {
            // Width-constrained
            spreadW = availW * 0.96;
            spreadH = spreadW / spreadRatio;
        }
        const leafW = Math.floor(spreadW / 2);
        const leafH = Math.floor(spreadH);
        return { leafW, leafH, spreadW: leafW * 2, spreadH: leafH };
    }

    // ── State ──
    const book    = document.getElementById('book');
    const leftBg  = document.getElementById('left-bg');
    const leaves  = [];
    let isDragging = false, currentDragLeaf = null, dragPointerId = null;
    let startX = 0, lastX = 0, startAngle = 0;
    let bookRect = {};
    let zoomScale = 1, panX = 0, panY = 0;
    const activeTouchPointers = new Map();
    let isPinching = false, pinchStartDistance = 0, pinchStartScale = 1;
    let pinchStartMidpoint = null, pinchStartPan = null, gestureConsumed = false;

    function clampPan() {
        const sceneRect = document.getElementById('scene').getBoundingClientRect();
        const maxX = Math.max(0, (book.offsetWidth * zoomScale - sceneRect.width) / 2 + 24);
        const maxY = Math.max(0, (book.offsetHeight * zoomScale - sceneRect.height) / 2 + 24);
        panX = Math.max(-maxX, Math.min(maxX, panX));
        panY = Math.max(-maxY, Math.min(maxY, panY));
    }

    function applyBookViewport() {
        clampPan();
        book.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${zoomScale}) rotateX(4deg)`;
    }

    function touchPoints() {
        return [...activeTouchPointers.values()];
    }

    function distanceBetween(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function midpointBetween(a, b) {
        return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    function cancelPageDrag() {
        if (!isDragging || !currentDragLeaf) return;
        currentDragLeaf.el.style.transition = '';
        setTransform(currentDragLeaf, startAngle);
        isDragging = false;
        currentDragLeaf = null;
        dragPointerId = null;
    }

    function beginPinchGesture() {
        const [first, second] = touchPoints();
        if (!first || !second) return;
        cancelPageDrag();
        isPinching = true;
        gestureConsumed = true;
        pinchStartDistance = distanceBetween(first, second);
        pinchStartScale = zoomScale;
        pinchStartMidpoint = midpointBetween(first, second);
        pinchStartPan = { x: panX, y: panY };
    }

    // ── Build ──
    function buildBook() {
        const { leafW, leafH, spreadW, spreadH } = getSize();

        // Book container = full spread
        book.style.width  = spreadW + 'px';
        book.style.height = spreadH + 'px';

        // Remove old leaves from DOM
        book.querySelectorAll('.leaf').forEach(el => el.remove());
        leaves.length = 0;

        for (let i = 0; i < TOTAL_LEAVES; i++) {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.dataset.index = i;
            leaf.style.width  = leafW + 'px';
            leaf.style.height = leafH + 'px';
            // Leaves sit on the RIGHT half (spine = left edge of leaf = center of book)
            leaf.style.left = leafW + 'px';
            leaf.style.top  = '0px';

            const frontPage = pagesData[i * 2];
            const backPage  = pagesData[i * 2 + 1];

            const frontImg = frontPage
                ? `<img src="${imageUrl(frontPage)}" loading="${i < 3 ? 'eager' : 'lazy'}" alt="第${i*2+1}頁">`
                : '<img style="background:#fff;">';
            const backImg = backPage
                ? `<img src="${imageUrl(backPage)}"  loading="${i < 3 ? 'eager' : 'lazy'}" alt="第${i*2+2}頁">`
                : '<img style="background:#fff;">';

            leaf.innerHTML = `
                <div class="face front">
                    ${frontImg}
                    <span class="page-num">${i*2+1}</span>
                </div>
                <div class="face back">
                    ${backImg}
                    ${backPage ? `<span class="page-num">${i*2+2}</span>` : ''}
                </div>
            `;

            const frontFace = leaf.querySelector('.face.front');
            const backFace = leaf.querySelector('.face.back');
            appendPageEnglishBox(frontFace, i * 2 + 1);
            if (backPage) appendPageEnglishBox(backFace, i * 2 + 2);

            book.appendChild(leaf);
            const obj = { el: leaf, index: i, angle: 0, w: leafW };
            leaves.push(obj);
            setTransform(obj, 0);
        }

        fitPageEnglishBoxes();
        updateUI();
        bookRect = book.getBoundingClientRect();
        applyBookViewport();
    }

    // ── Transform ──
    function setTransform(obj, angle, isTurning = false) {
        angle = Math.max(-180, Math.min(0, angle));
        obj.angle = angle;

        // z-index: unflipped leaves stack front-to-back on right;
        //          flipped leaves stack back-to-front on left
        const base = TOTAL_LEAVES - obj.index;
        let z = angle <= -90 ? obj.index + 1 : base + TOTAL_LEAVES;
        // Keep the whole sheet above every resting page until its CSS transition finishes.
        if (isTurning || (angle !== 0 && angle !== -180)) z += TOTAL_LEAVES * 2;

        obj.el.style.zIndex   = z;
        obj.el.style.transform = `rotateY(${angle}deg)`;
    }

    // ── UI ──
    function updateUI() {
        const flipped = leaves.filter(l => l.angle === -180).length;
        const leftPage  = flipped * 2;
        const rightPage = flipped * 2 + 1;

        let spreadText;
        if (flipped === 0) {
            spreadText = (lang === 'en') ? `Cover / Total ${TOTAL_PAGES} Pages` : `封面 / 共 ${TOTAL_PAGES} 頁`;
        } else {
            const l = Math.min(leftPage, TOTAL_PAGES);
            const r = Math.min(rightPage, TOTAL_PAGES);
            
            if (l === r) {
                spreadText = (lang === 'en') ? `Page ${l} / ${TOTAL_PAGES}` : `第 ${l} 頁 / ${TOTAL_PAGES}`;
            } else {
                spreadText = (lang === 'en') ? `Page ${l}–${r} / ${TOTAL_PAGES}` : `第 ${l}–${r} 頁 / ${TOTAL_PAGES}`;
            }
        }

        document.getElementById('page-indicator').textContent = spreadText;
        document.getElementById('spread-info').textContent    = spreadText;
        document.getElementById('btn-prev').disabled = (flipped === 0);
        document.getElementById('btn-next').disabled = (flipped >= MAX_FLIPPED_LEAVES);
        if (englishOpen) updateTranslation();
        updatePageEnglishStrips();
        if (USE_INCREMENTAL_PRELOAD) preloadPageRange(flipped * 2, PRELOAD_AHEAD);
    }

    // ── Flip ──
    function flipTo(obj, targetAngle, dur = 440) {
        if (USE_INCREMENTAL_PRELOAD && targetAngle === -180) {
            preloadPageRange((obj.index + 1) * 2, PRELOAD_AHEAD);
        }
        obj.el.style.transition = `transform ${dur}ms cubic-bezier(0.25,0.8,0.25,1)`;
        setTransform(obj, targetAngle, true);
        setTimeout(() => {
            obj.el.style.transition = '';
            setTransform(obj, targetAngle); // commit
            updateUI();
        }, dur + 10);
    }

    document.getElementById('btn-next').addEventListener('click', () => {
        const next = leaves.find(l => l.angle === 0 && l.index < MAX_FLIPPED_LEAVES);
        if (next) flipTo(next, -180);
    });
    document.getElementById('btn-prev').addEventListener('click', () => {
        const prev = [...leaves].reverse().find(l => l.angle === -180);
        if (prev) flipTo(prev, 0);
    });

    // ── Drag ──
    book.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') {
            activeTouchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activeTouchPointers.size >= 2) {
                beginPinchGesture();
                e.preventDefault();
                return;
            }
        }
        const leafEl = e.target.closest('.leaf');
        if (!leafEl) return;
        const obj = leaves[parseInt(leafEl.dataset.index)];
        if (obj.angle === 0 && obj.index >= MAX_FLIPPED_LEAVES) return;
        if (USE_INCREMENTAL_PRELOAD && obj.angle === 0) {
            preloadPageRange((obj.index + 1) * 2, PRELOAD_AHEAD);
        }
        obj.el.style.transition = 'none';
        isDragging = true;
        currentDragLeaf = obj;
        startX = e.clientX;
        lastX  = e.clientX;
        startAngle = obj.angle;
        dragPointerId = e.pointerId;
        bookRect = book.getBoundingClientRect();
        book.setPointerCapture(e.pointerId);
    });

    book.addEventListener('pointermove', e => {
        if (e.pointerType === 'touch' && activeTouchPointers.has(e.pointerId)) {
            activeTouchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }
        if (isPinching && activeTouchPointers.size >= 2) {
            const [first, second] = touchPoints();
            const distance = distanceBetween(first, second);
            const midpoint = midpointBetween(first, second);
            zoomScale = Math.max(1, Math.min(3, pinchStartScale * (distance / pinchStartDistance)));
            panX = pinchStartPan.x + midpoint.x - pinchStartMidpoint.x;
            panY = pinchStartPan.y + midpoint.y - pinchStartMidpoint.y;
            applyBookViewport();
            e.preventDefault();
            return;
        }
        if (!isDragging || !currentDragLeaf || e.pointerId !== dragPointerId) return;
        e.preventDefault();
        lastX = e.clientX;
        const leafW = currentDragLeaf.w;
        const delta = e.clientX - startX;
        const newAngle = startAngle + (delta / leafW) * 180;
        setTransform(currentDragLeaf, newAngle);
    });

    const endDrag = () => {
        if (!isDragging || !currentDragLeaf) return;
        isDragging = false;
        const obj = currentDragLeaf;
        currentDragLeaf = null;
        dragPointerId = null;

        const delta = lastX - startX;
        let snap;
        if (Math.abs(delta) < 10) {
            snap = startAngle === 0 ? -180 : 0;
        } else {
            snap = obj.angle < -90 ? -180 : 0;
        }
        flipTo(obj, snap, 400);
    };

    const endPointer = (e) => {
        if (e.pointerType === 'touch') {
            activeTouchPointers.delete(e.pointerId);
            if (isPinching && activeTouchPointers.size < 2) isPinching = false;
            if (gestureConsumed) {
                if (activeTouchPointers.size === 0) gestureConsumed = false;
                return;
            }
        }
        if (e.pointerId === dragPointerId) endDrag();
    };
    book.addEventListener('pointerup', endPointer);
    book.addEventListener('pointercancel', endPointer);

    // Mouse-wheel zoom follows the pointer, matching the touch pinch viewport.
    book.addEventListener('wheel', (e) => {
        e.preventDefault();
        const previousScale = zoomScale;
        const nextScale = Math.max(1, Math.min(3, previousScale * Math.exp(-e.deltaY * 0.0015)));
        if (nextScale === previousScale) return;

        const sceneRect = document.getElementById('scene').getBoundingClientRect();
        const focalX = e.clientX - (sceneRect.left + sceneRect.width / 2);
        const focalY = e.clientY - (sceneRect.top + sceneRect.height / 2);
        const ratio = nextScale / previousScale;
        panX = focalX * (1 - ratio) + panX * ratio;
        panY = focalY * (1 - ratio) + panY * ratio;
        zoomScale = nextScale;
        applyBookViewport();
    }, { passive: false });

    // ── Keyboard ──
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') document.getElementById('btn-next').click();
        if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   document.getElementById('btn-prev').click();
    });

    // ── Resize ──
    function rebuildBookForAvailableSpace() {
        const angles = leaves.map(l => l.angle);
        buildBook();
        angles.forEach((a, i) => { if (leaves[i]) setTransform(leaves[i], a); });
        updateUI();
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            rebuildBookForAvailableSpace();
        }, 120);
    });

    // ── Image preload queue ──
    // Keep a decoded window ahead of the reader instead of waiting for every page at startup.
    const PRELOAD_AHEAD = 8;
    const USE_INCREMENTAL_PRELOAD = bookKey === 'penghu_shihu';
    const preloadedUrls = new Map();

    function preloadUrl(url) {
        if (preloadedUrls.has(url)) return preloadedUrls.get(url);

        const task = new Promise((resolve) => {
            const img = new Image();
            const finish = async () => {
                try { await img.decode?.(); } catch (_) { /* already usable after load */ }
                resolve();
            };
            img.onload = finish;
            img.onerror = () => resolve(); // Keep navigation usable even if a source image fails.
            img.src = url;
        });
        preloadedUrls.set(url, task);
        return task;
    }

    function preloadPageRange(startIndex, count = PRELOAD_AHEAD) {
        const urls = pagesData
            .slice(Math.max(0, startIndex), Math.min(TOTAL_PAGES, startIndex + count))
            .map(imageUrl);
        return Promise.all(urls.map(preloadUrl));
    }

    async function preloadInitialImages() {
        const progressEl = document.getElementById('loading-progress');
        const initialCount = USE_INCREMENTAL_PRELOAD ? Math.min(PRELOAD_AHEAD, TOTAL_PAGES) : TOTAL_PAGES;
        progressEl.textContent = `0/${initialCount}`;
        const urls = pagesData.slice(0, initialCount).map(imageUrl);
        let loadedCount = 0;
        await Promise.all(urls.map(async (url) => {
            await preloadUrl(url);
            loadedCount++;
            progressEl.textContent = `${loadedCount}/${urls.length}`;
        }));
    }

    // ── Init ──
    renderPageEnglishStrips();
    buildBook();
    if (translationPanel.classList.contains('is-open')) {
        translationPlacement = resolveTranslationPlacement(firstPage, visiblePrintedPages());
        document.body.classList.toggle('translation-side', translationPlacement === 'side');
        document.body.classList.toggle('translation-bottom', translationPlacement === 'bottom');
        updateTranslation();
    }
    
    // Wait for images
    await preloadInitialImages();

    // Hide loading
    const ls = document.getElementById('loading-screen');
    ls.style.opacity = '0';
    setTimeout(() => {
        ls.remove();
        // Optional: show a small hint after entering
        setTimeout(() => { const h = document.getElementById('hint'); if (h) h.remove(); }, 5000);
    }, 550);
})();
</script>
</body>
</html>
