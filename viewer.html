<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子繪本閱讀器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: url('bg_optimized.webp') center/cover fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* ── Floating reader controls ── */
        #top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 0;
            z-index: 500;
            pointer-events: none;
        }
        #top-bar a {
            color: rgba(255,255,255,0.78);
            text-decoration: none;
            font-size: 0.82rem;
            display: flex; align-items: center; gap: 6px;
            position: absolute; top: 0; left: 0;
            padding: 9px 18px 9px 16px;
            border-radius: 0 999px 999px 0;
            border: 1px solid rgba(255,255,255,0.18); border-left: 0;
            background: rgba(8,8,18,0.58);
            backdrop-filter: blur(10px);
            transition: all 0.22s ease;
            pointer-events: auto;
        }
        #top-bar a:hover { background: rgba(8,8,18,0.78); color: white; }
        #book-title {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.78); font-size: 0.78rem; letter-spacing: 0.02em;
            padding: 7px 14px 9px; border-radius: 0 0 18px 18px; background: rgba(8,8,18,0.45);
            backdrop-filter: blur(10px);
        }
        #page-indicator { color: rgba(255,255,255,0.72); font-size: 0.78rem; letter-spacing: 1px; min-width: 110px; text-align: center; padding: 9px 16px 9px 12px; }
        #reader-actions { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 8px; min-width: 110px; justify-content: flex-end; pointer-events: auto; background: rgba(8,8,18,0.58); border: 1px solid rgba(255,255,255,0.18); border-right: 0; border-radius: 999px 0 0 999px; backdrop-filter: blur(10px); }
        .top-action {
            display: none;
            color: rgba(255,255,255,0.82);
            background: transparent;
            border: 0; border-right: 1px solid rgba(255,255,255,0.16);
            border-radius: 0;
            padding: 9px 12px 9px 16px;
            font: inherit;
            font-size: 0.78rem;
            cursor: pointer;
        }
        .top-action:hover { background: rgba(255,255,255,0.1); color: white; }

        /* ── Scene ── */
        #scene {
            position: fixed;
            top: 40px; bottom: 0;
            left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 3000px;
            perspective-origin: 50% 50%;
        }
        /* Keep the book out of the reading layer, with only its transparent edge touching. */
        @media (min-width: 641px) {
            body.translation-side #scene { right: calc(min(420px, 42vw) - 72px); }
        }
        body.translation-bottom #scene { bottom: calc(min(40vh, 340px) - 72px); }

        /*
         * #book = the full spread container (2 × page width)
         * transform-style so children 3D-flip in correct context
         */
        #book {
            position: relative;
            transform-style: preserve-3d;
            /* slight tilt for depth feel */
            transform: rotateX(4deg);
        }

        /*
         * Each .leaf sits on the RIGHT half of the book.
         * transform-origin: left center  →  spins around the spine.
         */
        .leaf {
            position: absolute;
            top: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            cursor: grab;
            will-change: transform;
        }
        .leaf:active { cursor: grabbing; }

        .face {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
            background: #fff;
        }
        .face.front { transform: rotateY(0deg); }
        .face.back  { transform: rotateY(180deg); }

        .face img {
            width: 100%; height: 100%;
            object-fit: contain;   /* ← show full page, no crop */
            object-position: center;
            display: block;
            pointer-events: none;
            background: #fff;
        }

        /* Subtle spine-edge shadow only — no overlay gradients */
        .face.front::after,
        .face.back::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 18px;
            pointer-events: none;
            opacity: 0;   /* hidden; only shown during flip via JS */
            transition: opacity 0.3s;
        }
        .face.front::after { left: 0;  background: linear-gradient(to right, rgba(0,0,0,0.18), transparent); }
        .face.back::after  { right: 0; background: linear-gradient(to left,  rgba(0,0,0,0.18), transparent); }

        /* Page number badge */
        .page-num {
            position: absolute;
            bottom: 10px;
            font-size: 0.7rem;
            color: rgba(0,0,0,0.35);
            font-family: monospace;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.06);
            pointer-events: none;
        }
        .face.front .page-num { right: 10px; }
        .face.back  .page-num { left:  10px; }

        /* Left-side static background (already-flipped pages rest here) */
        /* No static left-bg needed anymore to avoid "page zero" glitch */

        /* ── Bottom Controls ── */
        #controls {
            position: fixed;
            bottom: 18px; left: 50%; transform: translateX(-50%);
            height: auto;
            display: flex; align-items: center; justify-content: center; gap: 20px;
            z-index: 500;
        }
        .ctrl-btn {
            background: rgba(8,8,18,0.58);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
            color: white;
            padding: 9px 26px;
            border-radius: 22px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.22s ease;
            letter-spacing: 1px;
        }
        .ctrl-btn:hover:not(:disabled) {
            background: rgba(8,8,18,0.8);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }
        .ctrl-btn:disabled { opacity: 0.22; cursor: not-allowed; }
        #spread-info { color: rgba(255,255,255,0.72); font-size: 0.78rem; min-width: 90px; text-align: center; padding: 7px 12px; border-radius: 20px; background: rgba(8,8,18,0.45); backdrop-filter: blur(10px); }

        /* ── Loading ── */
        #loading-screen {
            position: fixed; inset: 0;
            background: url('natural-wooden-background.jpg') center/cover;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: rgba(120,160,255,0.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { margin-top: 16px; color: rgba(255,255,255,0.7); font-size: 0.85rem; letter-spacing: 2px; }
        #loading-progress { margin-top: 8px; color: rgba(120,160,255,0.8); font-size: 0.75rem; font-family: monospace; }

        /* Hint */
        #hint {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.28); font-size: 0.72rem; letter-spacing: 1px;
            pointer-events: none; white-space: nowrap;
            animation: fadeHint 5s ease forwards;
        }
        @keyframes fadeHint { 0%,60%{opacity:1} 100%{opacity:0} }

        /* English reading aid: a gradient reading layer over the artwork. */
        #translation-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: min(420px, 42vw);
            display: none;
            flex-direction: column;
            background: linear-gradient(to left, rgba(8,8,16,0.94) 0%, rgba(8,8,16,0.84) 70%, rgba(8,8,16,0) 100%);
            color: rgba(255,255,255,0.9);
            z-index: 400;
            overflow: hidden;
        }
        #translation-panel.is-open { display: flex; }
        #translation-close {
            appearance: none; border: 0; background: transparent; color: rgba(255,255,255,0.65);
            position: absolute; top: 10px; right: 12px; z-index: 1;
            font-size: 1.35rem; line-height: 1; cursor: pointer; padding: 2px 4px;
        }
        #translation-close:hover { color: white; }
        #translation-content {
            overflow-y: auto;
            padding: 17px 42px 17px 17px;
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-line;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.32) transparent;
        }
        #translation-content::-webkit-scrollbar { width: 8px; }
        #translation-content::-webkit-scrollbar-track { background: transparent; }
        #translation-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.28);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 999px;
        }
        #translation-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.45); }
        #translation-content::-webkit-scrollbar-button { display: none; }
        body.translation-side #translation-panel {
            border: 0;
            border-radius: 0;
            box-shadow: none;
            background: linear-gradient(to left, rgba(8,8,16,0.95) 0%, rgba(8,8,16,0.86) 68%, rgba(8,8,16,0) 100%);
        }
        body.translation-side #translation-content {
            padding: 52px 42px 42px clamp(140px, 10vw, 220px);
        }
        body.translation-bottom #translation-panel {
            top: auto;
            right: 0;
            bottom: 0;
            left: 0;
            width: auto;
            height: min(40vh, 340px);
            background: linear-gradient(to top, rgba(8,8,16,0.94) 0%, rgba(8,8,16,0.84) 70%, rgba(8,8,16,0) 100%);
        }
        body.translation-bottom #translation-content {
            width: min(1080px, 88vw);
            align-self: center;
            padding: 28px 30px 92px;
        }
        #translation-content p + p { margin-top: 1.35rem; }
        #translation-content .empty { color: rgba(255,255,255,0.55); }
        @media (max-width: 640px) {
            #top-bar { top: 0; left: 0; right: 0; }
            #top-bar a { padding: 7px 10px; }
            #book-title { display: none; }
            #controls { bottom: 10px; gap: 8px; }
            .ctrl-btn { padding: 8px 16px; }
            #translation-panel { width: min(88vw, 420px); }
            body.translation-bottom #translation-panel { width: auto; height: min(42vh, 300px); }
            body.translation-bottom #translation-content { width: 92vw; padding: 22px 20px 78px; }
            body.translation-side #translation-content { padding: 46px 32px 28px 72px; }
            body.translation-side #scene { right: calc(min(88vw, 420px) - 50px); }
            body.translation-bottom #scene { bottom: calc(min(42vh, 300px) - 50px); }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">正在準備繪本內容...</div>
    <div id="loading-progress">0%</div>
</div>

<div id="top-bar">
    <a href="index.html">&#8592; 返回書架</a>
    <span id="book-title">電子繪本</span>
    <div id="reader-actions">
        <button class="top-action" id="translation-toggle" type="button" aria-expanded="false">English text</button>
        <span id="page-indicator">—</span>
    </div>
</div>

<div id="scene">
    <div id="book">
        <!-- Leaves are stacked here -->
    </div>
</div>

<div id="hint">點擊或拖曳書頁翻頁・← → 鍵盤也可以</div>

<aside id="translation-panel" aria-label="English translation" aria-live="polite">
    <button id="translation-close" type="button" aria-label="Close English translation">×</button>
    <div id="translation-content"></div>
</aside>

<div id="controls">
    <button class="ctrl-btn" id="btn-prev">&#8592; 上一頁</button>
    <span id="spread-info">— / —</span>
    <button class="ctrl-btn" id="btn-next">下一頁 &#8594;</button>
</div>

<script src="translations.js?v=20261029-frontmatter"></script>
<script>
(async () => {
    // ── Params & Localization ──
    const params  = new URLSearchParams(location.search);
    const bookKey = params.get('book') || 'zaojiao';
    const LANGUAGE_PREFERENCE_KEY = 'onlinebook.language';
    let savedLanguage = null;
    try { savedLanguage = localStorage.getItem(LANGUAGE_PREFERENCE_KEY); } catch (_) { /* Keep the default below. */ }
    // A language in the link is an intentional choice; otherwise restore the last choice.
    const lang = params.get('lang') || savedLanguage || 'zh-TW';
    try { localStorage.setItem(LANGUAGE_PREFERENCE_KEY, lang); } catch (_) { /* Storage may be unavailable in private mode. */ }

    const i18n = {
        'zh-TW': {
            titles: { zaojiao: '社會系列・藻礁保衛戰', shigo: '親子系列・海客石滬', zaojiao_story: '桃園戶海系列・藻礁繪本', penghu_shihu: '桃園戶海系列・石滬爺爺說故事' },
            loading: '正在準備繪本內容...',
            prev: '← 上一頁',
            next: '下一頁 →',
            back: '← 返回書架',
            hint: '點擊或拖曳書頁翻頁・← → 鍵盤也可以'
        },
        'en': {
            titles: { zaojiao: 'Social Series: Algal Reef Defense', shigo: 'Parenting Series: Shigo Stone Weir', zaojiao_story: 'Taoyuan Coastal Series: Algal Reef Picture Book', penghu_shihu: 'Taoyuan Coastal Series: Grandpa Stone Weir Tells a Story' },
            loading: 'Preparing book content...',
            prev: '← Prev',
            next: 'Next →',
            back: '← Library',
            hint: 'Click or drag to flip • Arrow keys supported'
        }
    };

    const t = i18n[lang] || i18n['zh-TW'];
    document.getElementById('book-title').textContent = t.titles[bookKey] || 'E-Book';
    document.title = (t.titles[bookKey] || 'E-Book') + ' | Reader';
    document.getElementById('loading-text').textContent = t.loading;
    document.getElementById('btn-prev').textContent = t.prev;
    document.getElementById('btn-next').textContent = t.next;
    document.querySelector('#top-bar a').textContent = t.back;
    document.getElementById('hint').textContent = t.hint;

    // ── English translation panel ──
    const translationEntries = (window.bookTranslations && window.bookTranslations[bookKey]) || [];
    // Both supplied translations start after four cover / front-matter scans.
    const translationPageOffset = ['zaojiao', 'penghu_shihu'].includes(bookKey) ? 4 : 0;
    const translationToggle = document.getElementById('translation-toggle');
    const translationPanel = document.getElementById('translation-panel');
    const translationContent = document.getElementById('translation-content');
    let translationPlacement = 'side';

    function visiblePrintedPages() {
        const flipped = leaves.filter(l => l.angle === -180).length;
        if (flipped === 0) return [1, Math.min(2, TOTAL_PAGES)];
        return [Math.min(flipped * 2, TOTAL_PAGES), Math.min(flipped * 2 + 1, TOTAL_PAGES)];
    }

    function updateTranslation() {
        if (!translationEntries.length) return;
        const [first, last] = visiblePrintedPages();
        const activeEntries = translationEntries.filter((entry) => {
            const entryStart = entry.readerStart ?? entry.start + translationPageOffset;
            const entryEnd = entry.readerEnd ?? entry.end + translationPageOffset;
            return entryStart <= last && entryEnd >= first;
        });
        translationContent.replaceChildren();

        if (!activeEntries.length) return;

        activeEntries.forEach((entry) => {
            const text = document.createElement('p');
            text.textContent = entry.text;
            translationContent.append(text);
        });
    }

    function setTranslationOpen(isOpen) {
        translationPanel.classList.toggle('is-open', isOpen);
        document.body.classList.toggle('translation-open', isOpen);
        document.body.classList.toggle('translation-side', isOpen && translationPlacement === 'side');
        document.body.classList.toggle('translation-bottom', isOpen && translationPlacement === 'bottom');
        translationToggle.setAttribute('aria-expanded', String(isOpen));
        if (isOpen) updateTranslation();
        requestAnimationFrame(rebuildBookForAvailableSpace);
    }

    if (lang === 'en' && translationEntries.length) {
        translationToggle.style.display = 'inline-block';
        translationToggle.addEventListener('click', () => {
            setTranslationOpen(!translationPanel.classList.contains('is-open'));
        });
        document.getElementById('translation-close').addEventListener('click', () => {
            setTranslationOpen(false);
        });
        // English opens with its reading aid visible; placement is selected after the book ratio loads.
        translationPanel.classList.add('is-open');
        document.body.classList.add('translation-open');
        translationToggle.setAttribute('aria-expanded', 'true');
    }

    // ── Load JSON ──
    let pagesData = [];
    try {
        const res = await fetch(`book_${bookKey}_${lang}.json?v=${Date.now()}`);
        if (!res.ok) throw new Error(res.status);
        pagesData = await res.json();
    } catch(e) {
        document.getElementById('loading-text').textContent = (lang === 'en') ? 'Failed to load book data' : '無法載入繪本資料';
        console.error(e);
        return;
    }

    // ── Compute page aspect ratio from JSON data ──
    const firstPage = pagesData[0];
    const PAGE_RATIO = (firstPage && firstPage.width && firstPage.height)
        ? (firstPage.height / firstPage.width) 
        : 1.414;

    console.log("Detecting Book Ratio:", PAGE_RATIO, "isLandscape:", PAGE_RATIO < 1);

    // Portrait pages read best with a side column; a landscape spread keeps its width and uses a lower panel.
    translationPlacement = PAGE_RATIO < 1 ? 'bottom' : 'side';
    if (translationPanel.classList.contains('is-open')) {
        document.body.classList.toggle('translation-side', translationPlacement === 'side');
        document.body.classList.toggle('translation-bottom', translationPlacement === 'bottom');
    }

    const TOTAL_PAGES  = pagesData.length;
    // Bump this whenever page image assets are regenerated so visitors do not see stale scans.
    const IMAGE_VERSION = '20261024-assets-v6';
    const imageUrl = (page) => `${page.image}?v=${IMAGE_VERSION}`;
    const TOTAL_LEAVES = Math.ceil(TOTAL_PAGES / 2);
    // This book has no back cover after its final spread, so do not expose a blank page.
    const MAX_FLIPPED_LEAVES = bookKey === 'zaojiao_story' ? TOTAL_LEAVES - 1 : TOTAL_LEAVES;

    // ── Compute book size ──
    // Each page is portrait. Two pages side-by-side = landscape spread.
    // We fit the spread into the available viewport area.
    function getSize() {
        const sceneRect = document.getElementById('scene').getBoundingClientRect();
        const availW = sceneRect.width;
        const availH = sceneRect.height;

        // Spread is 2 pages wide
        // Spread W / Spread H = 2 / PAGE_RATIO
        const spreadRatio = 2 / PAGE_RATIO;

        let spreadW, spreadH;
        if (availW / availH > spreadRatio) {
            // Height-constrained
            spreadH = availH * 0.94;
            spreadW = spreadH * spreadRatio;
        } else {
            // Width-constrained
            spreadW = availW * 0.96;
            spreadH = spreadW / spreadRatio;
        }
        const leafW = Math.floor(spreadW / 2);
        const leafH = Math.floor(spreadH);
        return { leafW, leafH, spreadW: leafW * 2, spreadH: leafH };
    }

    // ── State ──
    const book    = document.getElementById('book');
    const leftBg  = document.getElementById('left-bg');
    const leaves  = [];
    let isDragging = false, currentDragLeaf = null;
    let startX = 0, lastX = 0, startAngle = 0;
    let bookRect = {};

    // ── Build ──
    function buildBook() {
        const { leafW, leafH, spreadW, spreadH } = getSize();

        // Book container = full spread
        book.style.width  = spreadW + 'px';
        book.style.height = spreadH + 'px';

        // Remove old leaves from DOM
        book.querySelectorAll('.leaf').forEach(el => el.remove());
        leaves.length = 0;

        for (let i = 0; i < TOTAL_LEAVES; i++) {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.dataset.index = i;
            leaf.style.width  = leafW + 'px';
            leaf.style.height = leafH + 'px';
            // Leaves sit on the RIGHT half (spine = left edge of leaf = center of book)
            leaf.style.left = leafW + 'px';
            leaf.style.top  = '0px';

            const frontPage = pagesData[i * 2];
            const backPage  = pagesData[i * 2 + 1];

            const frontImg = frontPage
                ? `<img src="${imageUrl(frontPage)}" loading="${i < 3 ? 'eager' : 'lazy'}" alt="第${i*2+1}頁">`
                : '<img style="background:#fff;">';
            const backImg = backPage
                ? `<img src="${imageUrl(backPage)}"  loading="${i < 3 ? 'eager' : 'lazy'}" alt="第${i*2+2}頁">`
                : '<img style="background:#fff;">';

            leaf.innerHTML = `
                <div class="face front">
                    ${frontImg}
                    <span class="page-num">${i*2+1}</span>
                </div>
                <div class="face back">
                    ${backImg}
                    ${backPage ? `<span class="page-num">${i*2+2}</span>` : ''}
                </div>
            `;

            book.appendChild(leaf);
            const obj = { el: leaf, index: i, angle: 0, w: leafW };
            leaves.push(obj);
            setTransform(obj, 0);
        }

        updateUI();
        bookRect = book.getBoundingClientRect();
    }

    // ── Transform ──
    function setTransform(obj, angle, isTurning = false) {
        angle = Math.max(-180, Math.min(0, angle));
        obj.angle = angle;

        // z-index: unflipped leaves stack front-to-back on right;
        //          flipped leaves stack back-to-front on left
        const base = TOTAL_LEAVES - obj.index;
        let z = angle <= -90 ? obj.index + 1 : base + TOTAL_LEAVES;
        // Keep the whole sheet above every resting page until its CSS transition finishes.
        if (isTurning || (angle !== 0 && angle !== -180)) z += TOTAL_LEAVES * 2;

        obj.el.style.zIndex   = z;
        obj.el.style.transform = `rotateY(${angle}deg)`;
    }

    // ── UI ──
    function updateUI() {
        const flipped = leaves.filter(l => l.angle === -180).length;
        const leftPage  = flipped * 2;
        const rightPage = flipped * 2 + 1;

        let spreadText;
        if (flipped === 0) {
            spreadText = (lang === 'en') ? `Cover / Total ${TOTAL_PAGES} Pages` : `封面 / 共 ${TOTAL_PAGES} 頁`;
        } else {
            const l = Math.min(leftPage, TOTAL_PAGES);
            const r = Math.min(rightPage, TOTAL_PAGES);
            
            if (l === r) {
                spreadText = (lang === 'en') ? `Page ${l} / ${TOTAL_PAGES}` : `第 ${l} 頁 / ${TOTAL_PAGES}`;
            } else {
                spreadText = (lang === 'en') ? `Page ${l}–${r} / ${TOTAL_PAGES}` : `第 ${l}–${r} 頁 / ${TOTAL_PAGES}`;
            }
        }

        document.getElementById('page-indicator').textContent = spreadText;
        document.getElementById('spread-info').textContent    = spreadText;
        document.getElementById('btn-prev').disabled = (flipped === 0);
        document.getElementById('btn-next').disabled = (flipped >= MAX_FLIPPED_LEAVES);
        if (translationPanel.classList.contains('is-open')) updateTranslation();
        if (USE_INCREMENTAL_PRELOAD) preloadPageRange(flipped * 2, PRELOAD_AHEAD);
    }

    // ── Flip ──
    function flipTo(obj, targetAngle, dur = 440) {
        if (USE_INCREMENTAL_PRELOAD && targetAngle === -180) {
            preloadPageRange((obj.index + 1) * 2, PRELOAD_AHEAD);
        }
        obj.el.style.transition = `transform ${dur}ms cubic-bezier(0.25,0.8,0.25,1)`;
        setTransform(obj, targetAngle, true);
        setTimeout(() => {
            obj.el.style.transition = '';
            setTransform(obj, targetAngle); // commit
            updateUI();
        }, dur + 10);
    }

    document.getElementById('btn-next').addEventListener('click', () => {
        const next = leaves.find(l => l.angle === 0 && l.index < MAX_FLIPPED_LEAVES);
        if (next) flipTo(next, -180);
    });
    document.getElementById('btn-prev').addEventListener('click', () => {
        const prev = [...leaves].reverse().find(l => l.angle === -180);
        if (prev) flipTo(prev, 0);
    });

    // ── Drag ──
    book.addEventListener('pointerdown', e => {
        const leafEl = e.target.closest('.leaf');
        if (!leafEl) return;
        const obj = leaves[parseInt(leafEl.dataset.index)];
        if (obj.angle === 0 && obj.index >= MAX_FLIPPED_LEAVES) return;
        if (USE_INCREMENTAL_PRELOAD && obj.angle === 0) {
            preloadPageRange((obj.index + 1) * 2, PRELOAD_AHEAD);
        }
        obj.el.style.transition = 'none';
        isDragging = true;
        currentDragLeaf = obj;
        startX = e.clientX;
        lastX  = e.clientX;
        startAngle = obj.angle;
        bookRect = book.getBoundingClientRect();
        book.setPointerCapture(e.pointerId);
    });

    book.addEventListener('pointermove', e => {
        if (!isDragging || !currentDragLeaf) return;
        e.preventDefault();
        lastX = e.clientX;
        const leafW = currentDragLeaf.w;
        const delta = e.clientX - startX;
        const newAngle = startAngle + (delta / leafW) * 180;
        setTransform(currentDragLeaf, newAngle);
    });

    const endDrag = () => {
        if (!isDragging || !currentDragLeaf) return;
        isDragging = false;
        const obj = currentDragLeaf;
        currentDragLeaf = null;

        const delta = lastX - startX;
        let snap;
        if (Math.abs(delta) < 10) {
            snap = startAngle === 0 ? -180 : 0;
        } else {
            snap = obj.angle < -90 ? -180 : 0;
        }
        flipTo(obj, snap, 400);
    };

    book.addEventListener('pointerup',     endDrag);
    book.addEventListener('pointercancel', endDrag);

    // ── Keyboard ──
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') document.getElementById('btn-next').click();
        if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   document.getElementById('btn-prev').click();
    });

    // ── Resize ──
    function rebuildBookForAvailableSpace() {
        const angles = leaves.map(l => l.angle);
        buildBook();
        angles.forEach((a, i) => { if (leaves[i]) setTransform(leaves[i], a); });
        updateUI();
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            rebuildBookForAvailableSpace();
        }, 120);
    });

    // ── Image preload queue ──
    // Keep a decoded window ahead of the reader instead of waiting for every page at startup.
    const PRELOAD_AHEAD = 8;
    const USE_INCREMENTAL_PRELOAD = bookKey === 'penghu_shihu';
    const preloadedUrls = new Map();

    function preloadUrl(url) {
        if (preloadedUrls.has(url)) return preloadedUrls.get(url);

        const task = new Promise((resolve) => {
            const img = new Image();
            const finish = async () => {
                try { await img.decode?.(); } catch (_) { /* already usable after load */ }
                resolve();
            };
            img.onload = finish;
            img.onerror = () => resolve(); // Keep navigation usable even if a source image fails.
            img.src = url;
        });
        preloadedUrls.set(url, task);
        return task;
    }

    function preloadPageRange(startIndex, count = PRELOAD_AHEAD) {
        const urls = pagesData
            .slice(Math.max(0, startIndex), Math.min(TOTAL_PAGES, startIndex + count))
            .map(imageUrl);
        return Promise.all(urls.map(preloadUrl));
    }

    async function preloadInitialImages() {
        const progressEl = document.getElementById('loading-progress');
        const initialCount = USE_INCREMENTAL_PRELOAD ? Math.min(PRELOAD_AHEAD, TOTAL_PAGES) : TOTAL_PAGES;
        progressEl.textContent = `0/${initialCount}`;
        const urls = pagesData.slice(0, initialCount).map(imageUrl);
        let loadedCount = 0;
        await Promise.all(urls.map(async (url) => {
            await preloadUrl(url);
            loadedCount++;
            progressEl.textContent = `${loadedCount}/${urls.length}`;
        }));
    }

    // ── Init ──
    buildBook();
    if (translationPanel.classList.contains('is-open')) updateTranslation();
    
    // Wait for images
    await preloadInitialImages();

    // Hide loading
    const ls = document.getElementById('loading-screen');
    ls.style.opacity = '0';
    setTimeout(() => {
        ls.remove();
        // Optional: show a small hint after entering
        setTimeout(() => { const h = document.getElementById('hint'); if (h) h.remove(); }, 5000);
    }, 550);
})();
</script>
</body>
</html>
